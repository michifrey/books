<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leseliste – Empfehlungen</title>
  <meta name="description" content="Kuratierte Buchempfehlungen mit Kurzzusammenfassungen, nach Themen sortiert.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="list-view">
  <header class="hero">
    <div class="wrap hero__inner">
      <div class="hero__top">
        <span class="logo">📚 Leseliste</span>
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Farbschema wechseln">◐</button>
      </div>
      <h1>Was den Kopf <em>weiter</em> macht.</h1>
      <p class="hero__lead">Persönliche Empfehlungen – Bücher, Hörbücher, Podcasts, Videos und Artikel – mit kurzer Zusammenfassung und den wichtigsten Gedanken, sortiert nach Themen.</p>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Titel, Autor:in oder Stichwort suchen …" autocomplete="off">
        <kbd>/</kbd>
      </label>
    </div>
  </header>

  <main class="wrap">
    <nav class="types" id="types" aria-label="Medientyp"></nav>

    <section class="toolbar" aria-label="Filter">
      <div class="chips" id="topics" role="group" aria-label="Themen"></div>
      <div class="toolbar__row">
        <p class="count" id="count" aria-live="polite"></p>
        <div class="controls">
          <select id="sort" aria-label="Sortierung">
            <option value="rating">Empfehlung</option>
            <option value="title">Titel A–Z</option>
            <option value="year-desc">Neueste zuerst</option>
            <option value="year-asc">Älteste zuerst</option>
          </select>
          <div class="segmented" role="group" aria-label="Ansicht">
            <button type="button" data-view="topics" aria-pressed="true">Nach Themen</button>
            <button type="button" data-view="grid" aria-pressed="false">Raster</button>
          </div>
        </div>
      </div>
    </section>

    <div id="results"></div>
  </main>
  </div>

  <div id="detail-view" hidden>
    <div class="wrap topbar">
      <a class="back" id="back" href="#">← Alle Empfehlungen</a>
      <button class="icon-btn" data-theme-toggle type="button" aria-label="Farbschema wechseln">◐</button>
    </div>
    <article class="wrap page" id="page"></article>
  </div>

  <footer class="wrap footer">
    <p>📚 Leseliste · Cover über <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>, sonst generiert</p>
  </footer>

  <script src="assets/app.js" type="module"></script>
</body>
</html>
